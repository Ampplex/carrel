# Carrel on the same EC2 box as the production MCP server.
#
# Its own compose project on purpose: `docker compose restart` here must never
# be able to touch the container serving mcp.reeve.co.in. Nothing is published
# on a public interface — nginx is the only way in, and the box's firewall
# allows 22/80/443 and nothing else.

services:
  db:
    image: postgres:16-alpine
    container_name: carrel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carrel
      POSTGRES_DB: carrel
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    # Bound to loopback so the tunnel works for maintenance and nothing else
    # can reach it. A database on 0.0.0.0 would quietly undo the firewall.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - carrel-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrel -d carrel"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Tuned down: this box has about a gigabyte free and is already running
    # something that matters more than Carrel.
    command: >
      postgres -c shared_buffers=128MB -c max_connections=40
               -c effective_cache_size=256MB -c work_mem=4MB

  api:
    build:
      context: ../backend
    image: carrel-api
    container_name: carrel-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./carrel.env
    ports:
      - "127.0.0.1:8010:8010"
    # Guardrails, not optimisation. An API that can consume the whole box takes
    # the MCP server down with it, and that is the failure worth preventing.
    mem_limit: 512m
    cpus: 1.0
    # Docker's default log driver grows without limit. On a 6GB volume shared
    # with a production MCP server, an unbounded log file is a slow outage for
    # something that is not even this service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Hits the endpoint that actually touches the database, so an API that is
      # listening but cannot serve anything is reported as unhealthy rather than
      # as up.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Read-only console over both stores. Published on loopback only and NOT
  # proxied by nginx, so it has no public address — the SSH key is the
  # authentication. See admin/README.md.
  admin:
    build:
      context: ../admin
    image: carrel-admin
    container_name: carrel-admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../admin/.env
    ports:
      - "127.0.0.1:8020:8020"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    cpus: 0.5

volumes:
  carrel-db-data:

secrets:
  db_password:
    file: ./db_password
