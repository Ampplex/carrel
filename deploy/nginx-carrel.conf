# carrel.reeve.co.in — Carrel's API.
#
# Its own server block rather than a path on mcp.reeve.co.in. The MCP vhost
# sends `location /` to the production server; adding to that file means every
# Carrel change is one typo away from taking Reeve offline. A separate vhost
# shares only nginx itself.
#
# Install:
#   sudo cp nginx-carrel.conf /etc/nginx/sites-available/carrel.reeve.co.in
#   sudo ln -s /etc/nginx/sites-available/carrel.reeve.co.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d carrel.reeve.co.in     # rewrites this for TLS
#
# The A record for carrel.reeve.co.in must already point at this box, or
# certbot's challenge fails and you are left with a broken vhost.

server {
    listen 80;
    server_name carrel.reeve.co.in;

    # Same hardening the MCP vhost carries. Repeated rather than shared,
    # because an include that one vhost silently stops matching is worse than
    # four visible lines.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Photos arrive base64-encoded inside JSON, which inflates them by a third.
    # A 1600px JPEG lands around 1MB; 8m leaves room without inviting uploads
    # this service has no reason to accept.
    client_max_body_size 8m;

    # The token in these URLs is a live credential until it is used. Logged
    # without the query string so it never lands in access.log; see
    # nginx-carrel-logformat.conf, which must be installed in /etc/nginx/conf.d/.
    location = /reset {
        access_log /var/log/nginx/carrel-access.log carrel_no_query;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /verify {
        access_log /var/log/nginx/carrel-access.log carrel_no_query;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Reeve answers take four to nine seconds, and a photo question can take
        # longer. nginx's 60s default would cut those off as gateway errors that
        # look like bugs in the app.
        proxy_read_timeout 180;
        proxy_send_timeout 180;

        proxy_buffering off;
        proxy_cache off;
    }
}
