# Goes in the http context — /etc/nginx/conf.d/ is included there on Ubuntu.
#
# A log format that records the path without its query string, for the two URLs
# whose query string IS a credential. `/reset?token=…` was being written into
# access.log in full, where a live single-use token sat in plaintext until it
# expired — readable by anyone with log access, and carried along by whatever
# ships those logs elsewhere.
log_format carrel_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status '
                           '$body_bytes_sent "$http_referer" "$http_user_agent"';
